<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>서울시 토지허가 지도</title>

    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Seoul Permit Map">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> 데이터 불러오는 중...</div>

    <button class="ranking-trigger-btn" onclick="toggleRankingPanel()">
        <i class="fa-solid fa-trophy"></i>
    </button>

    <div class="ranking-panel" id="rankingPanel">
        <div class="ranking-header">
            <div class="ranking-tab active" onclick="switchRankingTab('overall')">전체 순위</div>
            <div class="ranking-tab" onclick="switchRankingTab('district')">지역구별 순위</div>
            <button class="ranking-close-btn" onclick="toggleRankingPanel()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="ranking-content" id="rankingContent">
            </div>
    </div>

    <div class="top-container">
        <div class="filter-group" id="filterGroup">
            <button class="filter-btn active" id="btn60" onclick="setPeriod('60', this)">최근 60일</button>
            <button class="filter-btn" id="btn30" onclick="setPeriod('30', this)">최근 30일</button>
            <button class="filter-btn" id="btn7" onclick="setPeriod('7', this)">최근 7일</button>
            <button class="search-trigger-btn" onclick="toggleSearchMode(true)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div class="search-group" id="searchGroup">
            <input type="text" class="search-input" id="searchInput" placeholder="아파트명 또는 주소 입력...">
            <button class="close-search-btn" onclick="toggleSearchMode(false)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div id="last-updated" class="last-updated"></div>
    <button class="gps-btn" onclick="moveToCurrentLocation()">
        <i class="fa-solid fa-location-crosshairs"></i>
    </button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="./app.js"></script>
</body>
</html>
